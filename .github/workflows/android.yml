name: Сборка Android (APK)

# Запускается автоматически после каждого изменения кода,
# а также вручную: вкладка Actions -> эта сборка -> Run workflow.
on:
  push:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Скачать пакеты
        run: flutter pub get

      - name: Проверка кода
        run: flutter analyze

      - name: Тесты
        run: flutter test

      - name: Собрать APK
        run: flutter build apk --release

      - name: Сохранить APK в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Обновить ссылку для скачивания в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk partnershipping.apk
          NOTES="Последняя сборка. Коммит: ${GITHUB_SHA::7}, ветка: ${GITHUB_REF_NAME}"
          if gh release view android-latest >/dev/null 2>&1; then
            gh release delete android-latest --cleanup-tag --yes
          fi
          gh release create android-latest partnershipping.apk \
            --target "$GITHUB_SHA" \
            --title "Android: последняя версия" \
            --notes "$NOTES" \
            --prerelease
