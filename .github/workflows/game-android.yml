name: Игра Ashen Vale (Android APK)

on:
  push:
    paths:
      - "game/**"
      - ".github/workflows/game-android.yml"
  workflow_dispatch:

concurrency:
  group: game-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Подготовка Godot и подписи
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          echo "HOME=$HOME"
          ls -la /root/.local/share/godot/export_templates/ || true
          ls /root/.local/share/godot/export_templates/* | head -50 || true
          rm -rf ~/.local/share/godot/export_templates/4.3.stable
          cp -r /root/.local/share/godot/export_templates/4.3.stable ~/.local/share/godot/export_templates/4.3.stable
          echo "--- templates in HOME:"
          ls ~/.local/share/godot/export_templates/4.3.stable | grep -i android || true
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android \
            -keystore "$PWD/debug.keystore" -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          SDK="${ANDROID_HOME:-/usr/lib/android-sdk}"
          JAVA_DIR="${JAVA_HOME:-$(dirname "$(dirname "$(readlink -f "$(which javac)")")")}"
          echo "SDK=$SDK JAVA=$JAVA_DIR"
          ls "$SDK" "$SDK/build-tools" || true
          cat > ~/.config/godot/editor_settings-4.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JAVA_DIR"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/shutdown_adb_on_exit = true
          EOT

      - name: Android SDK (build-tools и платформа)
        run: |
          SDK="${ANDROID_HOME:-/usr/lib/android-sdk}"
          SM="$(find "$SDK" /usr/lib/android-sdk /opt -name sdkmanager -type f 2>/dev/null | head -1)"
          echo "sdkmanager=$SM"
          if [ -n "$SM" ]; then
            yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null || true
            "$SM" --sdk_root="$SDK" "build-tools;34.0.0" "platforms;android-34" || true
          fi
          ls "$SDK/build-tools" "$SDK/platforms" || true

      - name: Импорт ресурсов
        working-directory: game
        run: godot --headless --import || true

      - name: Сборка APK
        working-directory: game
        run: |
          mkdir -p ../build
          godot --headless --verbose --export-debug "Android" ../build/ashen-vale.apk
          ls -la ../build

      - uses: actions/upload-artifact@v4
        with:
          name: ashen-vale-apk
          path: build/ashen-vale.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ashen-vale-apk
      - name: Обновить ссылку для скачивания
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view game-latest >/dev/null 2>&1; then
            gh release delete game-latest --cleanup-tag --yes
          fi
          gh release create game-latest ashen-vale.apk \
            --target "$GITHUB_SHA" \
            --title "Ashen Vale: последняя сборка" \
            --notes "Коммит ${GITHUB_SHA::7}" \
            --prerelease
