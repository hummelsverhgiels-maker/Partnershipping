name: Сборка веб-версии

# Запускается, когда в описании изменения есть слово [web], или вручную.
# Собирает сайт и (если в настройках репозитория включены GitHub Pages
# с источником "GitHub Actions") публикует его.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[web]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Собрать сайт
        run: flutter build web --release --no-web-resources-cdn --dart-define=APP_BUILD=${GITHUB_SHA::7} --base-href "/${{ github.event.repository.name }}/"
      - name: Сохранить сайт в Artifacts (на случай, если Pages не включены)
        uses: actions/upload-artifact@v4
        with:
          name: web-site
          path: build/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
