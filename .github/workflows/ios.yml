name: Сборка iPhone (IPA без подписи)

# Запускается не после каждого изменения (macOS-минуты на GitHub дорогие), а:
#  - когда в описании изменения (коммита) есть слово [ios];
#  - или вручную: вкладка Actions -> эта сборка -> Run workflow
#    (работает, когда файл лежит в основной ветке репозитория).
# Результат: неподписанный файл .ipa в Artifacts. Подпись добавим позже.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ios]')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true

      - name: Скачать пакеты
        run: flutter pub get

      - name: Собрать iOS без подписи
        run: flutter build ios --release --no-codesign --dart-define=APP_BUILD=${GITHUB_SHA::7}

      - name: Упаковать в IPA
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qr partnershipping-unsigned.ipa Payload

      - name: Проверить, что виджет внутри приложения
        run: |
          ls -la Payload/Runner.app/PlugIns
          test -d Payload/Runner.app/PlugIns/DaysOffWidget.appex
          unzip -l partnershipping-unsigned.ipa | grep -i "appex/" | head -5

      - name: Сохранить IPA в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: partnershipping-unsigned.ipa

      - name: Выложить IPA в Releases (прямая ссылка для сервиса подписи)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Неподписанная сборка для iPhone. Коммит: ${GITHUB_SHA::7}"
          if gh release view ios-latest >/dev/null 2>&1; then
            gh release delete ios-latest --cleanup-tag --yes
          fi
          gh release create ios-latest partnershipping-unsigned.ipa \
            --target "$GITHUB_SHA" \
            --title "iPhone: неподписанная версия" \
            --notes "$NOTES" \
            --prerelease
